<!doctype html>
<html lang="en">
  <head>

    <link rel="preload" crossorigin="anonymous" href="https://assets.apedroidz.com/apedroidz/droidz-survival/v13/assets/fonts/Inter-700.woff2" as="font" type="font/woff2">
    <link rel="preload" crossorigin="anonymous" href="https://assets.apedroidz.com/apedroidz/droidz-survival/v13/assets/fonts/Inter-500.woff2" as="font" type="font/woff2">

    <meta charset="UTF-8" />

    <title>Droidz Survival</title>
    <style>
      /* Inter, bundled (assets/fonts): the readable face for descriptions,
         paired with the DRD_SRV pixel face for headings and buttons. */
      @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; font-display: block; src: url('https://assets.apedroidz.com/apedroidz/droidz-survival/v13/assets/fonts/Inter-500.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; font-display: block; src: url('https://assets.apedroidz.com/apedroidz/droidz-survival/v13/assets/fonts/Inter-700.woff2') format('woff2'); }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0f1e;
        overflow: hidden;
        /* prevent iOS touch callouts/scroll while playing */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* The cover (art/DS_Beta_cover.jpg) is up before a byte of the bundle has arrived, and
         the canvas is TRANSPARENT until the menu, so Boot's progress bar draws straight over
         this picture instead of over a navy slab that hides it (the owner, 20.09: «прелоадер
         поверх обложки, и пока грузится обложка тоже показывается»).

         It is an <img crossorigin>, not a CSS background, on purpose. A background image is
         fetched WITHOUT CORS, and a cross-origin image fetched that way taints any texture
         made from it — WebGL then refuses to draw it, which is exactly why the poster used
         to vanish the moment Phaser started on the site and came back nowhere. One CORS
         request, one cache entry, and BootScene adopts THIS element as its texture: no
         second download and no race.

         Boot hides it when the menu opens (the canvas letterboxes inside #game — left in
         place, the edges would keep peeking out beside the play area). */
      #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1e;
      }
      #cover {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center bottom;
        pointer-events: none;
      }
      /* The page's own preloader (owner, 18.10.2026: «добавить прелоадер при загрузке игры и надпись
         LOADING вернуть»). Boot draws LOADING and its bar on the canvas — but only once the bundle has
         come down and Phaser has started, and on a slow line that was ten seconds and more of a bare
         poster that looked frozen. This is the same caption, the same line under it and the same bar
         in the same place (over the lettering painted into the poster: cover px × s, s = the poster's
         cover scale), up with the poster at once; a light runs along the bar while the bundle loads.
         Boot removes it the moment its own cover is on the canvas (BootScene.preload). The face is
         the system sans: Inter is font-display: block and would hide the words while it loads. */
      #preload {
        --s: max(calc(100vw / 1920), calc(100vh / 1080));
        position: absolute;
        left: 50%;
        /* Anchored by the bar's foot (the bar's middle at 218 cover px over the poster's bottom, as
           BootScene's): when RELOAD appears the block grows upward and the bar stays where it was. */
        bottom: calc(var(--s) * 209);
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
        font-family: "Helvetica Neue", Arial, sans-serif;
        color: #fff;
        text-shadow: 0 2px 6px #000;
      }
      #preload .cap { font-size: clamp(22px, 4.6vh, 40px); font-weight: 700; letter-spacing: 0.02em; line-height: 1; }
      #preload .note { margin-top: 10px; font-size: clamp(13px, 2.3vh, 20px); font-weight: 500; color: #d7e2f2; }
      #preload .bar {
        position: relative;
        margin-top: calc(var(--s) * 14 + 6px);
        width: calc(var(--s) * 1080);
        max-width: 92vw;
        height: max(10px, calc(var(--s) * 18));
        box-sizing: border-box;
        border: max(1px, calc(var(--s) * 2)) solid rgba(255, 255, 255, 0.95);
        background: rgba(5, 8, 15, 0.85);
        overflow: hidden;
      }
      #preload .bar::after {
        content: '';
        position: absolute;
        top: 2px; bottom: 2px;
        width: 26%;
        left: -26%;
        background: #fff;
        animation: preloadRun 1.4s ease-in-out infinite;
      }
      @keyframes preloadRun { 0% { left: -26%; } 100% { left: 100%; } }
      @media (prefers-reduced-motion: reduce) { #preload .bar::after { animation: none; left: 0; width: 8%; } }
      /* The bundle failed or the boot never came: say so, and a way out (a bare poster said nothing). */
      #preload .reload {
        display: none;
        order: -1;
        margin-bottom: 18px;
        padding: 12px 34px;
        border: 2px solid #fff;
        background: rgba(5, 8, 15, 0.85);
        color: #fff;
        font: 700 16px "Helvetica Neue", Arial, sans-serif;
        letter-spacing: 0.12em;
        cursor: pointer;
        pointer-events: auto;
      }
      #preload.failed .reload { display: block; }
      #preload.failed .bar::after { animation: none; left: 0; width: 100%; background: #ff5a6a; }
      #preload.failed .note { color: #ffd2d7; }
      #game canvas {
        display: block;
        position: relative;
        z-index: 1;
        image-rendering: pixelated;
      }
      /**
       * «Поверни телефон» — чистым CSS, без единой строки скрипта.
       *
       * Игра горизонтальная: в портрете от арены остаётся полоска, а кнопки
       * управления налезают друг на друга. Но просим повернуть только ПОСЛЕ
       * первого касания (body.played, systems/Mobile.ts installGate): до него игра
       * грузится и показывает ворота TAP TO PLAY в любом положении телефона
       * (владелец, 01.10.2026: «сейчас поворот экрана обязательный, а я хотел бы,
       * чтобы игра прогружалась»).
       *
       * `pointer: coarse` отсекает десктоп: узкое окно на ноутбуке — это не
       * портретный телефон, и закрывать его подсказкой нельзя.
       */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        body.played #rotate {
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0a0f1e;
          color: #eaf3ff;
          font-family: Inter, system-ui, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate .glyph {
          width: 86px;
          height: 140px;
          border: 4px solid #6fd6ff;
          border-radius: 14px;
          animation: tip 1.8s ease-in-out infinite;
        }
        #rotate .line { font-size: 19px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        #rotate .sub { font-size: 14px; font-weight: 500; color: #8ba3c7; max-width: 26ch; line-height: 1.5; }
      }
      /* The gate on a phone (systems/Mobile.ts installGate): one big TAP TO PLAY over the loaded
         menu. The tap is what may open the full screen and wake the sound. */
      #gate { display: none; }
      #gate.on {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(5, 8, 15, .88);
        color: #eaf3ff;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
        padding: 16px;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
      }
      #gate .title { font-size: 13px; font-weight: 700; letter-spacing: .3em; color: #ffcf4a; }
      #gate .box {
        min-width: min(320px, 80vw);
        padding: 20px 28px;
        border: 4px solid #ffcf4a;
        background: #4a3c12;
        box-shadow: 0 0 0 4px rgba(255, 207, 74, .18), 0 0 28px rgba(255, 207, 74, .25);
        font-size: 26px;
        font-weight: 700;
        letter-spacing: .18em;
        color: #fff6d8;
        animation: gatePulse 1.4s ease-in-out infinite;
      }
      #gate .sub { font-size: 13px; font-weight: 500; color: #8ba3c7; max-width: 34ch; line-height: 1.45; }
      #gate .ios { display: none; font-size: 13px; font-weight: 500; color: #8ba3c7; max-width: 46ch; line-height: 1.45; }
      #gate.ios .ios { display: block; }
      #gate.nofs .sub { display: none; }
      #gate .ios b { color: #eaf3ff; }
      @keyframes gatePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }

      @keyframes tip {
        0%, 45% { transform: rotate(0deg); }
        70%, 100% { transform: rotate(-90deg); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-BDWSrs4a.js"></script>
  </head>
  <body>
    <script>
      // The page's preloader says what went wrong instead of standing still (18.10.2026): the game's
      // file did not come (a 404 after a new build, a dropped line), or the boot has not taken over
      // in 40 s. BootScene removes #preload when it starts, which ends both.
      (function () {
        function fail(msg, hard) {
          var p = document.getElementById('preload');
          if (!p) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { fail(msg, hard); }); return; }
          p.classList.add('failed');
          var c = p.querySelector('.cap');
          if (c && hard) c.textContent = "COULDN'T LOAD";
          var n = p.querySelector('.note');
          if (n) n.textContent = msg;
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT' && /assets\//.test(t.src || '')) fail("The game didn't load. Reload the page.", true);
        }, true);
        setTimeout(function () { fail('Taking too long - reload the page or check your connection.'); }, 40000);
      })();
    </script>
    <div id="game">
      <img id="cover" src="https://assets.apedroidz.com/apedroidz/droidz-survival/v13/assets/img/DS_Beta_cover.jpg" crossorigin="anonymous" alt="" />
      <div id="preload" aria-live="polite">
        <div class="cap">LOADING</div>
        <div class="note">First load may take a little longer</div>
        <div class="bar"></div>
        <button class="reload" type="button" onclick="location.reload()">RELOAD</button>
      </div>
    </div>
    <div id="gate" aria-hidden="true">
      <div class="title">DROIDZ SURVIVAL</div>
      <div class="box">TAP TO PLAY</div>
      <div class="sub">Opens full screen, sideways.</div>
      <div class="ios">For true fullscreen: <b>Share &rarr; Add to Home Screen</b></div>
    </div>
    <div id="rotate" aria-hidden="true">
      <div class="glyph"></div>
      <div class="line">Turn your phone</div>
      <div class="sub">Droidz Survival is played sideways — rotate to landscape to start.</div>
    </div>
  </body>
</html>
