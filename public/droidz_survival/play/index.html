<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1e" />
    <title>Droidz Survival</title>
    <style>
      /* Inter, bundled (assets/fonts): the readable face for descriptions,
         paired with the DRD_SRV pixel face for headings and buttons. */
      @font-face { font-family: 'Inter'; font-weight: 500; font-style: normal; font-display: block; src: url('https://assets.apedroidz.com/apedroidz/droidz-survival/v7/assets/fonts/Inter-500.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 700; font-style: normal; font-display: block; src: url('https://assets.apedroidz.com/apedroidz/droidz-survival/v7/assets/fonts/Inter-700.woff2') format('woff2'); }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0a0f1e;
        overflow: hidden;
        /* prevent iOS touch callouts/scroll while playing */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      /* The cover (art/DS_Beta_cover.jpg) is up before a byte of the bundle has arrived, and
         the canvas is TRANSPARENT until the menu, so Boot's progress bar draws straight over
         this picture instead of over a navy slab that hides it (the owner, 20.09: «прелоадер
         поверх обложки, и пока грузится обложка тоже показывается»).

         It is an <img crossorigin>, not a CSS background, on purpose. A background image is
         fetched WITHOUT CORS, and a cross-origin image fetched that way taints any texture
         made from it — WebGL then refuses to draw it, which is exactly why the poster used
         to vanish the moment Phaser started on the site and came back nowhere. One CORS
         request, one cache entry, and BootScene adopts THIS element as its texture: no
         second download and no race.

         Boot hides it when the menu opens (the canvas letterboxes inside #game — left in
         place, the edges would keep peeking out beside the play area). */
      #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0f1e;
      }
      #cover {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center bottom;
        pointer-events: none;
      }
      #game canvas {
        display: block;
        position: relative;
        z-index: 1;
        image-rendering: pixelated;
      }
      /**
       * «Поверни телефон» — чистым CSS, без единой строки скрипта.
       *
       * Игра горизонтальная: в портрете от арены остаётся полоска, а кнопки
       * управления налезают друг на друга. Подсказка сделана правилом, а не
       * кодом, намеренно — она должна работать и ДО того, как приехал бандл,
       * то есть в те самые секунды, когда человек впервые открыл ссылку с
       * телефона и ещё ничего не понимает.
       *
       * `pointer: coarse` отсекает десктоп: узкое окно на ноутбуке — это не
       * портретный телефон, и закрывать его подсказкой нельзя.
       */
      #rotate { display: none; }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate {
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 18px;
          background: #0a0f1e;
          color: #eaf3ff;
          font-family: Inter, system-ui, sans-serif;
          text-align: center;
          padding: 24px;
        }
        #rotate .glyph {
          width: 86px;
          height: 140px;
          border: 4px solid #6fd6ff;
          border-radius: 14px;
          animation: tip 1.8s ease-in-out infinite;
        }
        #rotate .line { font-size: 19px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
        #rotate .sub { font-size: 14px; font-weight: 500; color: #8ba3c7; max-width: 26ch; line-height: 1.5; }
      }
      /* Панель «в полный экран»: видна, только пока телефон на боку, а игра
         всё ещё в окне браузера (systems/Mobile.ts вешает класс .on). */
      #gofull { display: none; }
      #gofull.on {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: rgba(10, 15, 30, .82);
        color: #eaf3ff;
        font-family: Inter, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
        -webkit-tap-highlight-color: transparent;
      }
      #gofull .box {
        border: 3px solid #6fd6ff;
        border-radius: 14px;
        padding: 16px 28px;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      #gofull .sub { font-size: 14px; font-weight: 500; color: #8ba3c7; max-width: 30ch; line-height: 1.5; }

      @keyframes tip {
        0%, 45% { transform: rotate(0deg); }
        70%, 100% { transform: rotate(-90deg); }
      }
    </style>
    <script type="module" crossorigin src="./assets/index-CK5Uj-G-.js"></script>
  </head>
  <body>
    <div id="game">
      <img id="cover" src="https://assets.apedroidz.com/apedroidz/droidz-survival/v7/assets/img/DS_Beta_cover.jpg" crossorigin="anonymous" alt="" />
    </div>
    <div id="gofull" aria-hidden="true">
      <div class="box">Tap to play fullscreen</div>
      <div class="sub">A browser window in landscape leaves almost no room for the arena.</div>
    </div>
    <div id="rotate" aria-hidden="true">
      <div class="glyph"></div>
      <div class="line">Turn your phone</div>
      <div class="sub">Droidz Survival is played sideways — rotate to landscape to start.</div>
    </div>
  </body>
</html>
