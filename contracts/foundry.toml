[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.28"
optimizer = true
optimizer_runs = 800
evm_version = "cancun"

[rpc_endpoints]
apechain = "https://rpc.apechain.com/http"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
