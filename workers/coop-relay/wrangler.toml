# Droidz Survival co-op relay (docs: workers/coop-relay/README.md).
#
# Secrets (wrangler secret put …), never in this file:
#   COOP_SECRET  — the same value as the site's SURVIVAL_COOP_SECRET: it signs the players' room
#                  tokens (api/survival/coop/token) and authorises the relay's calls to the site
#                  (api/survival/coop/start).
name = "droidz-coop-relay"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
# The site the relay asks to open a co-op run (spend every member's run, all or nothing).
SITE_URL = "https://www.apedroidz.com"
# "1" only in local dev: unsigned `dev:<wallet>` tokens are accepted and a start spends nothing.
DEV = "0"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Directory"]
